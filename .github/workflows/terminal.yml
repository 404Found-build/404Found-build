name: Generate Terminal

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  build-terminal:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Terminal
        uses: yogeshwaran01/github-stats-terminal-style@master
        with:
          username: 404Found-build
          theme: gruvbox
          headerStyle: mac
          typingSpeed: 60
          hostname: 404Found
          commands: whoami,cat about.txt,cat skills.txt,cat builds.txt,cat links.txt,exit
          outputPath: assets/terminal.svg

      - name: Commit Terminal
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add assets/terminal.svg

          git diff --quiet && git diff --staged --quiet || \
            (git commit -m "chore: update terminal profile" && git push)
